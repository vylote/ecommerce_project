notification.payment_success.title=Đơn hàng đã thanh toán
notification.payment_success.message=Ting ting! Đơn hàng #{0} (PENDING) đã được thanh toán. Bạn có thể an tâm xác nhận đơn và đóng gói!

notification.order_new.title=Đơn hàng mới
notification.order_new.message=Bạn vừa nhận được đơn hàng mới #{0}. Hãy chuẩn bị sẵn sàng khi khách thanh toán nhé!

notification.order_confirmed.title=Đơn hàng đã được xác nhận
notification.order_confirmed.message=Shop đã xác nhận đơn hàng #{0} của bạn và đang đóng gói.

notification.order_shipping.title=Đơn hàng đang giao
notification.order_shipping.message=Đơn hàng #{0} đã được giao cho đơn vị vận chuyển.

notification.order_cancelled.title=Khách hàng hủy đơn
notification.order_cancelled.message=Đơn hàng #{0} đã bị khách hàng hủy. Đã hoàn lại tồn kho.

notification.order_completed.title=Giao dịch hoàn tất
notification.order_completed.message=Đơn hàng #{0} đã giao thành công. Doanh thu đã được cộng vào ví.
