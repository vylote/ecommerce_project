spring:
  application:
    name: ecommerce-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: user
    password: "3821"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB       # Dung lượng tối đa của MỘT file
      max-request-size: 15MB   # Dung lượng tối đa của TOÀN BỘ request (nếu up nhiều file cùng lúc)
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: WH1q@d,Qfc2NWF#ki#X}$pc4(z2Kte+*]![n/q6}fYWRVcJ{Ku?uqX#_lB_!&/f/^J7-0/u3:1QwUP(wUH;@&q
  expiration: 86400000
  refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

notification:
  service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:3000}

logging:
  file:
    name: logs/ecommerce-app.log
  level:
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.engine.transaction.internal.TransactionImpl: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 10MB # Khi file đạt 10MB, nó sẽ tự cắt sang file mới (ví dụ: ecommerce-app-1.log)
      max-history: 30 #

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}